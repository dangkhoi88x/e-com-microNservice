server:
  port: 8089

spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

services:
  product:
    base-url: http://localhost:8084
security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8090}
    audience: ${JWT_AUDIENCE:novashop-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/identity/api/.well-known/jwks.json}
