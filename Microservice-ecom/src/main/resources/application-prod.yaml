spring:

  datasource:
    url: jdbc:postgresql://postgresql:5432/identity-service
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret-key: ${JWT_SECRET}
  audience: ${JWT_AUDIENCE}

services:
  notification:
    url: ${NOTIFICATION_INTERNAL_URL:http://notification-service:8083}
    internal-api-key: ${INTERNAL_NOTIFICATION_API_KEY}

security:
  password-reset:
    pepper: ${PASSWORD_RESET_PEPPER}
  refresh-cookie:
    secure: true
    same-site: Lax
  refresh-request:
    # Required in production, for example: https://shop.example.com
    allowed-origins: ${SECURITY_REFRESH_ALLOWED_ORIGINS}
