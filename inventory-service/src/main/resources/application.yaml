server:
  port: 8087

spring:
  application:
    name: inventory-service
  kafka:
    bootstrap-servers: localhost:9094

  datasource:
    url: jdbc:postgresql://localhost:5435/inventory_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # schema.sql creates the aggregate/variant indexes after Hibernate has
    # updated the table.
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
