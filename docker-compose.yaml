services:
  product-postgres:
    image: postgres:17
    container_name: product-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    volumes:
      - product-postgres-data:/var/lib/postgresql/data
    networks:
      - microservice_network
  inventory-postgres:
    image: postgres:16
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data

  promotion-postgres:
    image: postgres:17
    container_name: promotion-postgres
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: promotion_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    volumes:
      - promotion-postgres-data:/var/lib/postgresql/data
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d promotion_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  shipping-postgres:
    image: postgres:17
    container_name: shipping-postgres
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: shipping_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    volumes:
      - shipping-postgres-data:/var/lib/postgresql/data
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d shipping_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  review-postgres:
    image: postgres:17
    container_name: review-postgres
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    volumes:
      - review-postgres-data:/var/lib/postgresql/data
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d review_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  seller-postgres:
    image: postgres:17
    container_name: seller-postgres
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: seller_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    volumes:
      - seller-postgres-data:/var/lib/postgresql/data
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d seller_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  media-postgres:
    image: postgres:17
    container_name: media-postgres
    ports:
      - "5441:5432"
    environment:
      POSTGRES_DB: media_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    volumes:
      - media-postgres-data:/var/lib/postgresql/data
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d media_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  review-service:
    build:
      context: ./review-service
    container_name: review-service
    ports:
      - "8097:8097"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://review-postgres:5432/review_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_ORDER_BASE_URL: http://host.docker.internal:8086
      SERVICES_PROFILE_BASE_URL: http://host.docker.internal:8081
      JWT_ISSUER: identity-service
      JWT_JWK_SET_URI: http://host.docker.internal:8090/identity/api/.well-known/jwks.json
    depends_on:
      review-postgres:
        condition: service_healthy
    networks:
      - microservice_network

  shipping-service:
    build:
      context: ./shipping-service
    container_name: shipping-service
    ports:
      - "8096:8096"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipping-postgres:5432/shipping_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_ISSUER: identity-service
      JWT_JWK_SET_URI: http://host.docker.internal:8090/identity/api/.well-known/jwks.json
    depends_on:
      shipping-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservice_network

  seller-service:
    build:
      context: ./seller-service
    container_name: seller-service
    ports:
      - "8098:8098"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://seller-postgres:5432/seller_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_SERVICE_BASE_URL: http://host.docker.internal:8090/identity/api
      JWT_ISSUER: identity-service
      JWT_JWK_SET_URI: http://host.docker.internal:8090/identity/api/.well-known/jwks.json
    depends_on:
      seller-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservice_network

  promotion-service:
    build:
      context: ./promotion-service
    container_name: promotion-service
    ports:
      - "8094:8095"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://promotion-postgres:5432/promotion_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      JWT_ISSUER: identity-service
      JWT_JWK_SET_URI: http://host.docker.internal:8090/identity/api/.well-known/jwks.json
    depends_on:
      promotion-postgres:
        condition: service_healthy
    networks:
      - microservice_network
  identity-postgres:
    image: postgres:17
    container_name: identity-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: identity-service
      POSTGRES_USER: dank
      POSTGRES_PASSWORD: 123456
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
    networks:
      - microservice_network

  wishlist-postgres:
    image: postgres:17
    container_name: wishlist-postgres
    ports:
      - "5442:5432"
    environment:
      POSTGRES_DB: wishlist_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    volumes:
      - wishlist-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d wishlist_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservice_network

  wishlist-service:
    build:
      context: ./wishlist-service
    container_name: wishlist-service
    ports:
      - "8092:8092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://wishlist-postgres:5432/wishlist_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      SERVICES_PRODUCT_BASE_URL: http://host.docker.internal:8084
      JWT_ISSUER: identity-service
      JWT_JWK_SET_URI: http://host.docker.internal:8090/identity/api/.well-known/jwks.json
    depends_on:
      wishlist-postgres:
        condition: service_healthy
    networks:
      - microservice_network

  redis:
    image: redis:8.6.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - microservice_network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo-data:/data
    networks:
      - microservice_network

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - microservice_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - microservice_network

  elasticsearch:
    image: elasticsearch:9.3.0
    container_name: elasticsearch
    ports:
      - "9200:9200"  # REST API
      - "9300:9300"  # Node communication
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=javabuilder
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - microservice_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -u elastic:javabuilder http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kibana:
    image: kibana:9.3.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=javabuilder
      - XPACK_FLEET_AGENTLESS_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=8HJ2YUPPfc9tFKGTn75xwVbwhryL9GVs
      - XPACK_SECURITY_ENCRYPTIONKEY=iEJent2TwMyy9xt26PoL2oBEqUChxthd
      - XPACK_REPORTING_ENCRYPTIONKEY=AMyQHG0z2sajxP2Nj9mbbrrCrXzP2tjC
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - microservice_network
volumes:
  product-postgres-data:
  identity-postgres-data:
  redis-data:
  mongo-data:
  kafka-data:
  elasticsearch_data:
  inventory_postgres_data:
  promotion-postgres-data:
  seller-postgres-data:
  shipping-postgres-data:
  review-postgres-data:
  wishlist-postgres-data:
  media-postgres-data:
    external: true
    name: media-service-local_media-postgres-data
networks:
  microservice_network:
