

spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/cart/**
            - id: wishlist-service
              uri: lb://wishlist-service
              predicates:
                - Path=/api/v1/wishlist/**
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/v1/search/**
server:
  port: 9191
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# Thêm Eureka config
eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
authentication:
  url: http://localhost:8090
grpc:
  client:
    identity-service:
      address: static://localhost:9090
      negotiationType: plaintext
