

spring:
  application:
    name: api-gateway-service
# Routes live in GatewayConfiguration.java only. Declaring them here as well duplicated four
# paths and hid a missing stripPrefix filter on /order/**.
server:
  port: 9191
logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# Thêm Eureka config
eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
authentication:
  grpc-deadline-ms: ${AUTHENTICATION_GRPC_DEADLINE_MS:800}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
grpc:
  client:
    identity-service:
      address: ${IDENTITY_GRPC_ADDRESS:static://localhost:9090}
      negotiationType: ${IDENTITY_GRPC_NEGOTIATION_TYPE:plaintext}
