

spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/cart/**
            - id: wishlist-service
              uri: lb://wishlist-service
              predicates:
                - Path=/api/v1/wishlist/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**
            - id: promotion-service
              uri: lb://promotion-service
              predicates:
                - Path=/api/v1/promotions/**
            - id: flash-deal-service
              uri: lb://promotion-service
              predicates:
                - Path=/api/v1/flash-deals/**
            - id: media-service
              uri: lb://media-service
              predicates:
                - Path=/api/v1/media/**
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/v1/search/**
server:
  port: 9191
logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# Thêm Eureka config
eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
authentication:
  grpc-deadline-ms: ${AUTHENTICATION_GRPC_DEADLINE_MS:800}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
grpc:
  client:
    identity-service:
      address: ${IDENTITY_GRPC_ADDRESS:static://localhost:9090}
      negotiationType: ${IDENTITY_GRPC_NEGOTIATION_TYPE:plaintext}
