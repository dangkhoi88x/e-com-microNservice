<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu NovaShop</title>
</head>
<body style="margin:0;background:#f4f7f7;font-family:Arial,sans-serif;color:#183036">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f4f7f7">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e2e9e9;border-radius:20px;overflow:hidden">
        <tr><td style="padding:28px 32px;background:#0f766e;color:#fff">
          <div style="font-size:13px;font-weight:700;letter-spacing:.12em">NOVASHOP</div>
          <h1 style="margin:10px 0 0;font-size:24px">Đặt lại mật khẩu</h1>
        </td></tr>
        <tr><td style="padding:32px">
          <p style="margin:0 0 20px;line-height:1.6;color:#526268">Dùng mã xác nhận dưới đây để tiếp tục đặt lại mật khẩu của bạn:</p>
          <div style="padding:20px;text-align:center;border-radius:14px;background:#edf8f6;color:#0b675f;font-family:monospace;font-size:34px;font-weight:800;letter-spacing:10px" th:text="${otp}">123456</div>
          <p style="margin:20px 0 0;line-height:1.6;color:#526268">Mã có hiệu lực trong <strong th:text="${expiresInMinutes}">10</strong> phút và chỉ sử dụng một lần.</p>
          <p style="margin:14px 0 0;line-height:1.6;color:#8a5555">Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này và không chia sẻ mã cho bất kỳ ai.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
