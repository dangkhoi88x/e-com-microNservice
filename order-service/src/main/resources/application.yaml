server:
  port: 8086
spring:
  application:
    name: order-service
  config:
    import: optional:file:.env.dev[.properties],optional:file:../.env.dev[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9094
services:
  payment:
    internal-api-key: ${INTERNAL_PAYMENT_API_KEY:local-payment-internal-key}

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8090}
    audience: ${JWT_AUDIENCE:novashop-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/identity/api/.well-known/jwks.json}
