server:
  port: 8095

spring:
  application:
    name: promotion-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
  datasource:
    url: jdbc:postgresql://localhost:5437/promotion_db
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

flash-deal:
  status-refresh-ms: 60000
