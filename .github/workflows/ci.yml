name: CI

on:
  push:
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Root pom aggregates all seventeen services, so this compiles every module
      # and catches things a single-module build would miss.
      - name: Build all modules
        run: mvn -B -ntp -DskipTests package

      # The *ApplicationTests classes only assert that the Spring context loads, which
      # needs PostgreSQL, Kafka and Eureka. Everything else is a plain Mockito test and
      # runs anywhere. Bringing that infrastructure up is a separate, later step.
      - name: Run unit tests
        run: mvn -B -ntp -Dtest='!*ApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
