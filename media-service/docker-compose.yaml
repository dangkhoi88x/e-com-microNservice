name: media-service-local

services:
  media-postgres:
    image: postgres:17
    container_name: media-postgres
    ports:
      - "5441:5432"
    environment:
      POSTGRES_DB: media_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    volumes:
      - media-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d media_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  media-postgres-data:
