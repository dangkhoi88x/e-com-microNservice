server:
  port: 8088

spring:
  application:
    name: payment-service
  config:
    import: optional:file:.env.dev[.properties],optional:file:../.env.dev[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # The partial unique index in schema.sql is created after Hibernate has
    # created/updated the payments table.
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9094

jwt:
  secret-key: "your-secret-key-here"

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/shop/payment-result?status=success&paymentId={PAYMENT_ID}&session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/shop/payment-result?status=cancel&paymentId={PAYMENT_ID}}
  currency: ${STRIPE_CURRENCY:vnd}

services:
  order:
    internal-api-key: ${INTERNAL_PAYMENT_API_KEY:local-payment-internal-key}

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
